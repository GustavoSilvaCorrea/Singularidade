<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso — Diário da Campanha</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <main>
        <div class="fichaContainer estreita">
            <span class="marca tl"></span>
            <span class="marca tr"></span>
            <span class="marca bl"></span>
            <span class="marca br"></span>

            <div class="tela">
                <svg class="planeta" viewBox="0 0 200 200" aria-hidden="true">
                    <circle cx="100" cy="100" r="55" fill="none" stroke="currentColor" stroke-width="2" />
                    <path d="M 45 85 Q 100 100 155 85" fill="none" stroke="currentColor" stroke-width="1.2" />
                    <path d="M 45 115 Q 100 100 155 115" fill="none" stroke="currentColor" stroke-width="1.2" />
                    <ellipse cx="100" cy="100" rx="95" ry="28" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(-18 100 100)" />
                    <circle cx="190" cy="72" r="3" fill="currentColor" />
                    <circle cx="12" cy="128" r="2" fill="currentColor" />
                </svg>

                <h2>Acesso</h2>

                <form id="form-login" class="login-form" autocomplete="off">
                    <div class="bloco">
                        <label for="nome">Personagem</label>
                        <input type="text" id="nome" class="campo-linha" autocomplete="off" required>
                    </div>
                    <div class="bloco">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" class="campo-linha" autocomplete="off" required>
                    </div>
                    <button type="submit" class="btn-cyber">Entrar</button>
                    <p id="mensagem-erro" class="mensagem-erro">Tripulante ou senha incorretos.</p>
                </form>
            </div>
        </div>
    </main>

    <script src="login.js" defer></script>
</body>

</html>
